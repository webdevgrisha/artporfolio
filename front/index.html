<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fff" />
    <meta name="robots" content="noindex" />
    <title>ArtPortfolio</title>
    <script>
      // Before the first paint, so a dark page does not flash white. The key is in features/toggle-theme.
      try {
        if (localStorage.getItem("theme") === "dark") {
          document.documentElement.dataset.theme = "dark";
          document.querySelector('meta[name="theme-color"]').content = "#141414";
        }
      } catch {
        // Blocked storage: the page stays light.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
