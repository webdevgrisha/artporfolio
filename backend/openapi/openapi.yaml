openapi: 3.1.0
info:
  title: Art portfolio API
  version: 1.0.0
  description: |-
    API of the art portfolio: the public site reads it, the admin panel changes it.

    - Bodies are JSON unless an operation says otherwise. Unknown fields are rejected.
    - Errors are Problem Details (RFC 9457), sent as `application/problem+json`.
    - A browser request from an origin outside the CORS allowlist gets `403`.
    - Any operation can answer `500` to an unexpected error, which is logged and has no `detail`.
    - A JSON body is limited to 100 KB; a larger one returns `413`.
    - A path parameter that names nothing, such as an unknown page, returns `404`.
servers:
  - url: https://artportfolio-b2ef4.web.app
    description: Production
  - url: http://127.0.0.1:5500
    description: Local emulators (`pnpm emulators`)
tags:
  - name: Health
    description: Monitoring.
  - name: Auth
    description: The admin session and CSRF protection.
  - name: Contacts
    description: Contact links and the contact photo.
  - name: Pages
    description: Pages of the public site and their main photos (heroes).
paths:
  /api/health:
    get:
      operationId: getHealth
      tags:
        - Health
      summary: Check that the API is up
      security: []
      responses:
        "200":
          description: The API is up.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    const: ok
                required:
                  - status
                additionalProperties: false
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/auth/csrf:
    get:
      operationId: issueCsrfToken
      tags:
        - Auth
      summary: Issue a CSRF token
      description: Every request that changes data needs the token in the `X-CSRF-Token` header.
      security: []
      responses:
        "200":
          description: A new token.
          headers:
            Set-Cookie:
              required: true
              description: Sets the CSRF cookie that matches the token.
              schema:
                type: string
                description: Sets the CSRF cookie that matches the token.
          content:
            application/json:
              schema:
                type: object
                properties:
                  csrfToken:
                    type: string
                    description: Send it back in the `X-CSRF-Token` header.
                required:
                  - csrfToken
                additionalProperties: false
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/auth/login:
    post:
      operationId: login
      tags:
        - Auth
      summary: Start an admin session
      description: Exchanges a Firebase ID token for an admin session cookie.
      security:
        - csrf: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                idToken:
                  type: string
                  minLength: 1
              required:
                - idToken
              additionalProperties: false
      responses:
        "200":
          description: Signed in.
          headers:
            Set-Cookie:
              required: true
              description: Sets the httpOnly `admin_session` cookie.
              schema:
                type: string
                description: Sets the httpOnly `admin_session` cookie.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/User"
                required:
                  - user
                additionalProperties: false
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Not the admin, or the password was entered more than 5 minutes ago.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
  /api/auth/me:
    get:
      operationId: getCurrentUser
      tags:
        - Auth
      summary: Get the signed-in admin
      security:
        - session: []
      responses:
        "200":
          description: The signed-in admin.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/User"
                required:
                  - user
                additionalProperties: false
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/auth/logout:
    post:
      operationId: logout
      tags:
        - Auth
      summary: End the admin session
      description: Clears the session cookies and revokes the session. Succeeds without a session.
      security:
        - csrf: []
      responses:
        "204":
          description: Done, no body.
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/contacts:
    get:
      operationId: getContacts
      tags:
        - Contacts
      summary: Get the contact links and the contact photo
      description: Returns empty strings until the links are first saved.
      security: []
      responses:
        "200":
          description: The contacts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  contacts:
                    $ref: "#/components/schemas/Contacts"
                  photo:
                    anyOf:
                      - $ref: "#/components/schemas/Photo"
                      - type: "null"
                    description: "`null` until a photo is uploaded."
                required:
                  - contacts
                  - photo
                additionalProperties: false
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      operationId: replaceContacts
      tags:
        - Contacts
      summary: Replace the contact links
      description: Every field is required; values are trimmed.
      security:
        - session: []
          csrf: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  description: Empty, or an email address.
                  type: string
                  maxLength: 2048
                instagram:
                  description: Empty, or an `http(s)` URL with a domain.
                  type: string
                  maxLength: 2048
                linkedin:
                  description: Empty, or an `http(s)` URL with a domain.
                  type: string
                  maxLength: 2048
                youtube:
                  description: Empty, or an `http(s)` URL with a domain.
                  type: string
                  maxLength: 2048
              required:
                - email
                - instagram
                - linkedin
                - youtube
              additionalProperties: false
      responses:
        "200":
          description: The saved links.
          content:
            application/json:
              schema:
                type: object
                properties:
                  contacts:
                    $ref: "#/components/schemas/Contacts"
                required:
                  - contacts
                additionalProperties: false
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
  /api/contacts/photo:
    put:
      operationId: uploadContactPhoto
      tags:
        - Contacts
      summary: Upload or replace the contact photo
      description: The previous photo is deleted after the new one is saved.
      security:
        - session: []
          csrf: []
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                alt:
                  type: string
                  minLength: 1
                  maxLength: 250
                  description: Text alternative for the photo.
                file:
                  type: string
                  format: binary
                  contentEncoding: binary
                  maxLength: 15728640
                  description: "A JPEG or PNG photo of up to 15 MB and 50 megapixels, with a file name of up to 255 characters. WebP and AVIF are rejected: they are already compressed for the web. The EXIF orientation is applied and all metadata, including the location, is removed. The original is kept privately to rebuild the images later."
              required:
                - alt
                - file
              additionalProperties: false
            encoding:
              file:
                contentType: image/jpeg, image/png
      responses:
        "200":
          description: The photo was replaced.
          content:
            application/json:
              schema:
                type: object
                properties:
                  photo:
                    $ref: "#/components/schemas/Photo"
                required:
                  - photo
                additionalProperties: false
        "201":
          description: The first photo was uploaded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  photo:
                    $ref: "#/components/schemas/Photo"
                required:
                  - photo
                additionalProperties: false
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
    patch:
      operationId: updateContactPhotoAlt
      tags:
        - Contacts
      summary: Change the alt text of the contact photo
      security:
        - session: []
          csrf: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                alt:
                  type: string
                  minLength: 1
                  maxLength: 250
                  description: Text alternative for the photo.
              required:
                - alt
              additionalProperties: false
      responses:
        "200":
          description: The photo with the new alt text.
          content:
            application/json:
              schema:
                type: object
                properties:
                  photo:
                    $ref: "#/components/schemas/Photo"
                required:
                  - photo
                additionalProperties: false
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
    delete:
      operationId: deleteContactPhoto
      tags:
        - Contacts
      summary: Delete the contact photo
      description: Deletes the photo and its files. Succeeds when there is no photo.
      security:
        - session: []
          csrf: []
      responses:
        "204":
          description: Done, no body.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/pages:
    get:
      operationId: listPages
      tags:
        - Pages
      summary: Get every page of the public site
      security: []
      responses:
        "200":
          description: Every page, by id.
          content:
            application/json:
              schema:
                type: object
                properties:
                  pages:
                    $ref: "#/components/schemas/Pages"
                required:
                  - pages
                additionalProperties: false
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/pages/{page}/hero:
    put:
      operationId: uploadPageHero
      tags:
        - Pages
      summary: Upload or replace the hero of a page
      description: The previous hero is deleted after the new one is saved.
      security:
        - session: []
          csrf: []
      parameters:
        - in: path
          name: page
          schema:
            $ref: "#/components/schemas/PageId"
          required: true
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  contentEncoding: binary
                  maxLength: 15728640
                  description: "A JPEG or PNG photo of up to 15 MB and 50 megapixels, with a file name of up to 255 characters. WebP and AVIF are rejected: they are already compressed for the web. The EXIF orientation is applied and all metadata, including the location, is removed. The original is kept privately to rebuild the images later."
              required:
                - file
              additionalProperties: false
            encoding:
              file:
                contentType: image/jpeg, image/png
      responses:
        "200":
          description: The hero was replaced.
          content:
            application/json:
              schema:
                type: object
                properties:
                  hero:
                    $ref: "#/components/schemas/Image"
                required:
                  - hero
                additionalProperties: false
        "201":
          description: The page had no hero.
          content:
            application/json:
              schema:
                type: object
                properties:
                  hero:
                    $ref: "#/components/schemas/Image"
                required:
                  - hero
                additionalProperties: false
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
    delete:
      operationId: deletePageHero
      tags:
        - Pages
      summary: Delete the hero of a page
      description: Deletes the hero and its files. Succeeds when the page has no hero.
      security:
        - session: []
          csrf: []
      parameters:
        - in: path
          name: page
          schema:
            $ref: "#/components/schemas/PageId"
          required: true
      responses:
        "204":
          description: Done, no body.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  schemas:
    PageId:
      type: string
      enum:
        - home
        - gallery
        - projects
        - about
        - contacts
    ProblemDetails:
      type: object
      properties:
        type:
          type: string
          const: about:blank
          description: "Always `about:blank`: the status code says all there is."
        title:
          type: string
          description: The reason phrase of the status code.
          example: Bad Request
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          description: What went wrong in this occurrence. Absent on `500`.
          example: Invalid request body
          type: string
        errors:
          description: Every invalid value of the request body. Present only on `400` for a body.
          type: array
          items:
            $ref: "#/components/schemas/InvalidField"
      required:
        - type
        - title
        - status
      additionalProperties: false
    InvalidField:
      type: object
      properties:
        detail:
          type: string
          description: What is wrong with the value.
        pointer:
          type: string
          description: JSON Pointer (RFC 6901) to the value, in URI fragment form.
          example: "#/alt"
      required:
        - detail
        - pointer
      additionalProperties: false
    User:
      type: object
      properties:
        email:
          anyOf:
            - type: string
              format: email
              pattern: ^(?:[A-Za-z0-9_'+\-]+\.)*[A-Za-z0-9_'+\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
            - type: "null"
        uid:
          type: string
      required:
        - email
        - uid
      additionalProperties: false
      description: The signed-in admin.
    Contacts:
      type: object
      properties:
        email:
          description: Empty, or an email address.
          anyOf:
            - type: string
              const: ""
            - type: string
              format: email
              pattern: ^(?:[A-Za-z0-9_'+\-]+\.)*[A-Za-z0-9_'+\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
        instagram:
          description: Empty, or an `http(s)` URL with a domain.
          anyOf:
            - type: string
              const: ""
            - type: string
              format: uri
        linkedin:
          description: Empty, or an `http(s)` URL with a domain.
          anyOf:
            - type: string
              const: ""
            - type: string
              format: uri
        youtube:
          description: Empty, or an `http(s)` URL with a domain.
          anyOf:
            - type: string
              const: ""
            - type: string
              format: uri
      required:
        - email
        - instagram
        - linkedin
        - youtube
      additionalProperties: false
      description: Contact links. An empty string means the contact is not shown on the site.
    Photo:
      type: object
      properties:
        fileName:
          type: string
          description: Name of the uploaded file.
        fileSize:
          type: integer
          exclusiveMinimum: 0
          maximum: 9007199254740991
          description: Size of the uploaded file, in bytes.
        width:
          type: integer
          exclusiveMinimum: 0
          maximum: 9007199254740991
          description: Width of the largest image.
        height:
          type: integer
          exclusiveMinimum: 0
          maximum: 9007199254740991
          description: Height of the largest image.
        sources:
          type: object
          properties:
            avif:
              type: array
              items:
                $ref: "#/components/schemas/ImageSource"
              description: Ordered by width.
            webp:
              type: array
              items:
                $ref: "#/components/schemas/ImageSource"
              description: Ordered by width.
          required:
            - avif
            - webp
          additionalProperties: false
        version:
          type: string
          description: Changes with every upload.
        alt:
          type: string
          minLength: 1
          maxLength: 250
          description: Text alternative for the photo.
      required:
        - fileName
        - fileSize
        - width
        - height
        - sources
        - version
        - alt
      additionalProperties: false
    ImageSource:
      type: object
      properties:
        url:
          type: string
          format: uri
          description: Download URL; the file never changes, so it is cached for a year.
        width:
          type: integer
          exclusiveMinimum: 0
          maximum: 9007199254740991
      required:
        - url
        - width
      additionalProperties: false
    Pages:
      type: object
      properties:
        home:
          $ref: "#/components/schemas/Page"
        gallery:
          $ref: "#/components/schemas/Page"
        projects:
          $ref: "#/components/schemas/Page"
        about:
          $ref: "#/components/schemas/Page"
        contacts:
          $ref: "#/components/schemas/Page"
      required:
        - home
        - gallery
        - projects
        - about
        - contacts
      additionalProperties: false
    Page:
      type: object
      properties:
        hero:
          anyOf:
            - $ref: "#/components/schemas/Image"
            - type: "null"
          description: Background under the page title, so it has no alt text. `null` until a hero is uploaded.
      required:
        - hero
      additionalProperties: false
    Image:
      type: object
      properties:
        fileName:
          type: string
          description: Name of the uploaded file.
        fileSize:
          type: integer
          exclusiveMinimum: 0
          maximum: 9007199254740991
          description: Size of the uploaded file, in bytes.
        width:
          type: integer
          exclusiveMinimum: 0
          maximum: 9007199254740991
          description: Width of the largest image.
        height:
          type: integer
          exclusiveMinimum: 0
          maximum: 9007199254740991
          description: Height of the largest image.
        sources:
          type: object
          properties:
            avif:
              type: array
              items:
                $ref: "#/components/schemas/ImageSource"
              description: Ordered by width.
            webp:
              type: array
              items:
                $ref: "#/components/schemas/ImageSource"
              description: Ordered by width.
          required:
            - avif
            - webp
          additionalProperties: false
        version:
          type: string
          description: Changes with every upload.
      required:
        - fileName
        - fileSize
        - width
        - height
        - sources
        - version
      additionalProperties: false
      description: An uploaded photo, resized without cropping to the widths 640, 960, 1280 and 1920 (never wider than the original) and encoded as AVIF and WebP.
  responses:
    Forbidden:
      description: The CSRF token is missing or invalid, or the origin is not allowed.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    BadRequest:
      description: The request is invalid. For an invalid body, `errors` lists every invalid value.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    PayloadTooLarge:
      description: The request body or the uploaded file is too large.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    UnsupportedMediaType:
      description: The body is in a format the endpoint does not take.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    Unauthorized:
      description: There is no valid admin session.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    NotFound:
      description: The resource does not exist.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: admin_session
      description: The httpOnly admin session cookie set by `POST /api/auth/login`.
    csrf:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: A token from `GET /api/auth/csrf`, sent together with the CSRF cookie set by the same request (double-submit). The token is bound to the session, so request a new one after login.
