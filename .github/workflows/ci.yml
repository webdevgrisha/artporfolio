name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check code quality
        run: pnpm check

      - name: Run tests
        run: pnpm test

      - name: Build applications
        run: pnpm build

  deploy:
    name: Deploy to Firebase
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: firebase-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: artportfolio-b2ef4
          workload_identity_provider: projects/351074606816/locations/global/workloadIdentityPools/github-actions/providers/github-provider
          service_account: github-firebase-deployer@artportfolio-b2ef4.iam.gserviceaccount.com

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy Hosting and Functions
        run: pnpm exec firebase deploy --project artportfolio-b2ef4 --only functions,hosting --non-interactive
